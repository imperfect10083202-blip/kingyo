<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>金魚すくい</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* 構成: 夜店の暗い背景に青い水槽を縦いっぱいに置く。上に成績と紙の強さ、下に操作ボタン。 */
:root {
  --night: #0f1a2c;
  --night-hi: #1a2a45;
  --paper: #f4ecd8;
  --ink: #2a2118;
  --muted: #9db0c9;
  --lantern: #ffb23e;
  --vermilion: #e8452c;
  --vermilion-dk: #8f2412;
  --rim: #ece5d2;
  --display: "Dela Gothic One", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
  --body: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background-color: var(--night);
  background-image: linear-gradient(180deg, var(--night-hi), var(--night) 60%);
  color: var(--paper);
  font-family: var(--body);
  font-weight: 500;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#app { height: 100%; display: flex; flex-direction: column; gap: 10px; padding-block: 12px; max-width: 560px; margin: 0 auto; }
.label { font-size: 11px; letter-spacing: .14em; color: var(--muted); font-weight: 700; }
.hud { display: grid; grid-template-columns: 1fr 1fr 1fr; align-items: end; gap: 8px; }
.stat { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.stat.mid { align-items: center; }
.stat.end { align-items: flex-end; }
.num { font-family: var(--display); font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
.lives { display: flex; gap: 6px; height: 30px; align-items: center; }
.lf { display: block; width: 20px; height: 20px; border-radius: 50%; border: 4px solid var(--paper); background: rgba(244,236,216,.35); }
.lf.used { border-color: rgba(244,236,216,.25); background: transparent; }
.paperrow { display: flex; align-items: center; gap: 10px; }
.bar { flex: 1; height: 10px; border-radius: 5px; background: rgba(255,255,255,.12); overflow: hidden; }
.bar i { display: block; height: 100%; width: 100%; border-radius: 5px; background: var(--paper); transition: width .12s linear, background-color .2s; }
.bar i.warn { background: var(--lantern); }
.bar i.crit { background: var(--vermilion); }
.pct { width: 2.6em; text-align: right; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pond {
  position: relative; flex: 1; min-height: 0; border-radius: 28px; border: 6px solid var(--rim);
  overflow: hidden; background: #2b9bc4; box-shadow: 0 0 0 2px rgba(0,0,0,.35), 0 16px 40px rgba(0,0,0,.5);
}
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.toast {
  position: absolute; left: 12px; right: 12px; bottom: 12px; padding: 9px 12px; border-radius: 12px;
  background: rgba(10,20,34,.8); color: var(--paper); font-size: 13px; font-weight: 700; text-align: center; pointer-events: none;
}
.overlay { position: absolute; inset: 0; display: flex; padding: 16px; overflow-y: auto; background: rgba(6,22,34,.55); }
.card {
  margin: auto; width: 100%; max-width: 340px; background: var(--paper); color: var(--ink); border-radius: 18px;
  padding: 22px 20px 18px; display: flex; flex-direction: column; gap: 12px;
  box-shadow: 0 18px 40px rgba(0,0,0,.45), inset 0 0 0 2px rgba(42,33,24,.08);
}
h1, h2 { font-family: var(--display); font-weight: 400; margin: 0; line-height: 1.15; text-wrap: balance; }
h1 { font-size: 38px; letter-spacing: .04em; }
h2 { font-size: 24px; text-align: center; }
.lead { margin: 0; font-size: 15px; line-height: 1.6; font-weight: 700; }
.rules { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; font-size: 14px; line-height: 1.55; }
.rules li { position: relative; padding-left: 18px; }
.rules li::before { content: ""; position: absolute; left: 2px; top: .6em; width: 8px; height: 8px; border-radius: 50%; background: var(--vermilion); }
.note { margin: 0; font-size: 12px; line-height: 1.5; color: #6b5a45; }
.score-big { font-family: var(--display); font-size: 76px; line-height: 1; text-align: center; color: var(--vermilion); font-variant-numeric: tabular-nums; }
.sub { text-align: center; font-size: 14px; font-weight: 700; }
.controls { display: flex; gap: 10px; align-items: center; }
button { font-family: var(--body); touch-action: manipulation; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--lantern); outline-offset: 2px; }
.btn-main, .btn-scoop {
  border: 0; border-radius: 28px; background: var(--vermilion); color: #fff; font-family: var(--display);
  font-size: 20px; letter-spacing: .2em; box-shadow: 0 4px 0 var(--vermilion-dk);
}
.btn-main { height: 54px; width: 100%; }
.btn-scoop { flex: 1; height: 58px; font-size: 22px; }
.btn-main:active, .btn-scoop:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--vermilion-dk); }
.btn-tilt {
  height: 58px; padding: 0 16px; border-radius: 29px; border: 2px solid var(--muted); background: transparent;
  color: var(--paper); font-weight: 700; font-size: 14px; white-space: nowrap;
}
.btn-tilt.on { border-color: var(--lantern); color: var(--lantern); }
.btn-tilt.off { opacity: .55; }
.btn-sound { flex: none; width: 58px; height: 58px; border-radius: 50%; border: 2px solid var(--lantern); background: transparent; color: var(--lantern); font-weight: 700; font-size: 16px; }
.btn-sound.off { border-color: var(--muted); color: var(--muted); opacity: .55; text-decoration: line-through; }
</style>

<div id="app">
  <header class="hud">
    <div class="stat"><span class="label">点数</span><span class="num" id="score">0</span></div>
    <div class="stat mid"><span class="label">のこり</span><span class="num" id="time">90</span></div>
    <div class="stat end"><span class="label">ポイ</span><span class="lives" id="lives"></span></div>
  </header>
  <div class="paperrow">
    <span class="label">紙</span>
    <div class="bar"><i id="paperBar"></i></div>
    <span class="pct" id="paperPct">100</span>
  </div>
  <main class="pond" id="pond">
    <canvas id="cv" role="img" aria-label="金魚が泳ぐ水槽"></canvas>
    <div class="toast" id="toast" hidden></div>
    <div class="overlay" id="startOv">
      <div class="card">
        <h1>金魚すくい</h1>
        <p class="lead">ポイの紙が破れる前に、できるだけ多くすくおう。</p>
        <ul class="rules">
          <li>指でポイを動かし、離すとすくう</li>
          <li>スマホを傾けてもポイが動く（使える環境のみ）</li>
          <li>速く動かすと金魚は逃げ、紙も傷む</li>
          <li>小さな金魚は1〜3点、出目金は5点、大きな琉金は10点。大きいほど紙が破れやすい</li>
        </ul>
        <button class="btn-main" id="startBtn" type="button">はじめる</button>
        <p class="note">お囃子の音楽つきです。下の「音」ボタンで消せます。</p>
        <p class="note" id="bestNote"></p>
      </div>
    </div>
    <div class="overlay" id="endOv" hidden>
      <div class="card">
        <h2 id="rankTitle">見習い</h2>
        <div class="score-big" id="finalScore">0</div>
        <div class="sub"><span>点</span> ・ <span id="finalCount">0</span>匹</div>
        <p class="note" id="bestLine" style="text-align:center"></p>
        <button class="btn-main" id="retryBtn" type="button">もう一回</button>
      </div>
    </div>
  </main>
  <footer class="controls">
    <button class="btn-tilt off" id="tiltBtn" type="button">傾き OFF</button>
    <button class="btn-sound" id="soundBtn" type="button" aria-pressed="true" aria-label="音">音</button>
    <button class="btn-scoop" id="scoopBtn" type="button">すくう</button>
  </footer>
</div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var cv = $('cv'), ctx = cv.getContext('2d');
  var W = 300, H = 500, dpr = 1, waterGrad = null;

  var GAME_TIME = 90, MAX_POI = 3, POI_R = 40, TARGET_FISH = 15, TOUCH_OFFSET = 66, TILT_G = 1100;
  var BEST_KEY = 'kingyo-sukui-best';

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function wrap(a) { while (a > Math.PI) a -= Math.PI * 2; while (a < -Math.PI) a += Math.PI * 2; return a; }
  function vibrate(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }

  var TYPES = [
    { id: 'wakin',  w: 44, L: 34, Wd: 13, pts: 1,  cost: 12, spd: 58, body: '#ff7f2e', fin: '#ffb98a', eye: '#1b1b24' },
    { id: 'aka',    w: 25, L: 38, Wd: 15, pts: 2,  cost: 14, spd: 66, body: '#e5382c', fin: '#f58a7e', eye: '#1b1b24' },
    { id: 'sarasa', w: 16, L: 42, Wd: 16, pts: 3,  cost: 18, spd: 60, body: '#fff0dc', fin: '#ffd3c2', eye: '#1b1b24', spots: '#e5382c' },
    { id: 'deme',   w: 9,  L: 44, Wd: 20, pts: 5,  cost: 26, spd: 42, body: '#23222e', fin: '#4a4960', eye: '#23222e', bulge: true },
    { id: 'ryukin', w: 6,  L: 62, Wd: 30, pts: 10, cost: 40, spd: 30, body: '#ff9a3c', fin: '#ffc78f', eye: '#1b1b24' }
  ];
  function pickType() {
    var r = Math.random() * 100, acc = 0;
    for (var i = 0; i < TYPES.length; i++) { acc += TYPES[i].w; if (r < acc) return TYPES[i]; }
    return TYPES[0];
  }

  // 紙に開く穴の位置（ポイ半径に対する比率）。互いに重ならない配置。
  var HOLES = [[-.3, -.28, .17], [.38, -.2, .15], [-.05, .38, .17], [.05, -.58, .12], [-.55, .15, .12], [.55, .3, .13], [.12, .05, .13]];

  var state = 'ready';
  var score = 0, caughtCount = 0, timeLeft = GAME_TIME, poisLeft = MAX_POI;
  var fish = [], ripples = [], floaters = [], pending = [];
  var poi = { x: 0, y: 0, vx: 0, vy: 0, dur: 100, lift: 0, liftT: 0, liftDur: 0.8, lifting: false, caught: [], broken: false, dropped: false, cool: 0, visible: false, rt: 0 };
  var input = { down: false, id: null, tx: 0, ty: 0 };
  var tilt = { enabled: false, supported: null, seen: false, listening: false, g0: null, b0: null, ax: 0, ay: 0, probe: null };
  var hs = { score: -1, time: -1, dur: -1 };

  /* ---------- サイズ ---------- */
  function resize() {
    var r = cv.getBoundingClientRect();
    if (r.width < 10 || r.height < 10) return;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = r.width; H = r.height;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    waterGrad = ctx.createLinearGradient(0, 0, 0, H);
    waterGrad.addColorStop(0, '#5cc8e4');
    waterGrad.addColorStop(1, '#2b9bc4');
    poi.x = clamp(poi.x, POI_R, W - POI_R); poi.y = clamp(poi.y, POI_R, H - POI_R);
    for (var i = 0; i < fish.length; i++) { fish[i].x = clamp(fish[i].x, 16, W - 16); fish[i].y = clamp(fish[i].y, 16, H - 16); }
  }

  /* ---------- 金魚 ---------- */
  function makeFish(x, y) {
    var T = pickType(), a = rand(0, Math.PI * 2);
    return { T: T, x: x, y: y, a: a, ta: a, spd: T.spd * rand(0.75, 1.25), phase: rand(0, 6.28), turnT: rand(0, 2), rest: 0, flee: 0, s: 0, ox: 0, oy: 0 };
  }
  function randomSpot(minD) {
    var x = W / 2, y = H / 2;
    for (var i = 0; i < 14; i++) {
      x = rand(40, W - 40); y = rand(40, H - 40);
      if (!poi.visible || Math.hypot(x - poi.x, y - poi.y) > minD) break;
    }
    return { x: x, y: y };
  }
  function fillPond() {
    fish = [];
    for (var i = 0; i < TARGET_FISH; i++) { var s = randomSpot(170); fish.push(makeFish(s.x, s.y)); }
  }
  function updateFish(dt) {
    var pv = Math.hypot(poi.vx, poi.vy);
    var scary = state === 'play' && poi.visible && !poi.lifting && poi.cool <= 0;
    for (var i = 0; i < fish.length; i++) {
      var f = fish[i];
      f.turnT -= dt;
      if (f.turnT <= 0) { f.ta = f.a + rand(-0.9, 0.9); f.turnT = rand(1, 3); if (Math.random() < 0.22) f.rest = rand(0.6, 1.6); }
      if (f.rest > 0) f.rest -= dt;
      var m = 46;
      if (f.x < m || f.x > W - m || f.y < m || f.y > H - m) { f.ta = Math.atan2(H / 2 - f.y, W / 2 - f.x) + rand(-0.4, 0.4); f.turnT = 0.6; }
      var boost = 1;
      if (scary) {
        var dx = f.x - poi.x, dy = f.y - poi.y, d = Math.hypot(dx, dy);
        if (d < 160 && pv > 90) { f.ta = Math.atan2(dy, dx); f.flee = 0.9; f.turnT = 0.4; f.rest = 0; }
      }
      if (f.flee > 0) { f.flee -= dt; boost = 1 + 3 * Math.min(1, f.flee / 0.5); }
      var rate = (f.flee > 0 ? 7 : 2.2) * dt;
      f.a += clamp(wrap(f.ta - f.a), -rate, rate);
      var s = f.spd * (f.rest > 0 ? 0.12 : 1) * boost;
      f.x = clamp(f.x + Math.cos(f.a) * s * dt, 16, W - 16);
      f.y = clamp(f.y + Math.sin(f.a) * s * dt, 16, H - 16);
      f.phase += dt * (2.5 + s * 0.09);
      f.s = s;
    }
  }

  /* ---------- ポイ ---------- */
  function newPoi() {
    poi.x = W / 2; poi.y = H * 0.7; poi.vx = 0; poi.vy = 0; poi.dur = 100;
    poi.lift = 0; poi.lifting = false; poi.caught = []; poi.broken = false; poi.dropped = false;
    poi.visible = true; poi.cool = 0; poi.rt = 0;
  }
  function splash(x, y, n) {
    for (var i = 0; i < n; i++) ripples.push({ x: x, y: y, r: -i * 12, max: 60 + i * 14 });
  }
  function breakNow() {
    poi.dur = 0; poi.caught = []; poi.broken = true; poi.dropped = false;
    poi.lifting = true; poi.liftT = 0; poi.liftDur = 0.6;
  }
  function dropFish() {
    poi.dropped = true; poi.visible = false;
    for (var i = 0; i < poi.caught.length; i++) {
      var f = poi.caught[i];
      f.x = clamp(poi.x + f.ox, 16, W - 16); f.y = clamp(poi.y + f.oy, 16, H - 16);
      f.a = rand(0, Math.PI * 2); f.ta = f.a; f.flee = 1.2;
      fish.push(f);
    }
    poi.caught = [];
    floaters.push({ x: poi.x, y: poi.y - 30, text: 'やぶれた！', t: 0, life: 1.5, color: '#ff8a70' });
    splash(poi.x, poi.y, 3);
    vibrate([40, 40, 60]); sfxBreak();
  }
  function finishLift() {
    poi.lifting = false; poi.lift = 0;
    if (poi.broken) {
      poisLeft--; renderLives(); poi.visible = false; poi.caught = [];
      if (poisLeft <= 0) { endGame(); return; }
      poi.cool = 0.9;
      return;
    }
    if (poi.caught.length) {
      var pts = 0;
      for (var i = 0; i < poi.caught.length; i++) { pts += poi.caught[i].T.pts; pending.push({ t: rand(1.2, 3) }); }
      score += pts; caughtCount += poi.caught.length;
      floaters.push({ x: poi.x, y: poi.y - 50, text: '+' + pts, t: 0, life: 1.1, color: '#ffd27a' });
      vibrate(25); sfxCatch(pts);
      poi.caught = [];
    }
  }
  function scoop() {
    if (state !== 'play' || !poi.visible || poi.lifting || poi.cool > 0) return;
    var got = [];
    for (var i = 0; i < fish.length; i++) {
      var f = fish[i];
      if (Math.hypot(f.x - poi.x, f.y - poi.y) < POI_R * 0.8 - f.T.L * 0.05) got.push(f);
    }
    poi.caught = got; poi.broken = false; poi.dropped = false; poi.lifting = true; poi.liftT = 0;
    if (got.length) {
      var cost = 4;
      for (var j = 0; j < got.length; j++) {
        cost += got[j].T.cost;
        got[j].ox = clamp(got[j].x - poi.x, -POI_R * 0.6, POI_R * 0.6);
        got[j].oy = clamp(got[j].y - poi.y, -POI_R * 0.6, POI_R * 0.6);
      }
      fish = fish.filter(function (f2) { return got.indexOf(f2) < 0; });
      poi.dur -= cost;
      if (poi.dur <= 0) { poi.dur = 0; poi.broken = true; }
      poi.liftDur = 0.9;
    } else {
      poi.liftDur = 0.35;
    }
    splash(poi.x, poi.y, 2); sfxSplash();
  }
  function updatePoi(dt) {
    if (poi.cool > 0) { poi.cool -= dt; if (poi.cool <= 0) newPoi(); return; }
    if (!poi.visible && !poi.lifting) return;
    if (poi.lifting) {
      poi.liftT += dt;
      var t = poi.liftT / poi.liftDur;
      poi.lift = Math.sin(Math.min(t, 1) * Math.PI);
      for (var i = 0; i < poi.caught.length; i++) poi.caught[i].phase += dt * 14;
      if (poi.broken && !poi.dropped && t >= 0.45) dropFish();
      if (t >= 1) finishLift();
      return;
    }
    var ax = 0, ay = 0;
    if (input.down) {
      ax += (input.tx - poi.x) * 140 - poi.vx * 22;
      ay += (input.ty - poi.y) * 140 - poi.vy * 22;
    } else {
      ax -= poi.vx * 2.2; ay -= poi.vy * 2.2;
    }
    if (tilt.enabled && tilt.seen) { ax += tilt.ax * TILT_G; ay += tilt.ay * TILT_G; }
    poi.vx += ax * dt; poi.vy += ay * dt;
    var sp = Math.hypot(poi.vx, poi.vy);
    if (sp > 900) { poi.vx *= 900 / sp; poi.vy *= 900 / sp; sp = 900; }
    poi.x += poi.vx * dt; poi.y += poi.vy * dt;
    if (poi.x < POI_R) { poi.x = POI_R; if (poi.vx < 0) poi.vx = 0; }
    if (poi.x > W - POI_R) { poi.x = W - POI_R; if (poi.vx > 0) poi.vx = 0; }
    if (poi.y < POI_R) { poi.y = POI_R; if (poi.vy < 0) poi.vy = 0; }
    if (poi.y > H - POI_R) { poi.y = H - POI_R; if (poi.vy > 0) poi.vy = 0; }
    poi.rt -= dt;
    if (sp > 35 && poi.rt <= 0) { ripples.push({ x: poi.x, y: poi.y, r: 0, max: 46 + sp * 0.06 }); poi.rt = 0.1; }
    poi.dur -= (0.8 + sp * 0.012) * dt;
    if (poi.dur <= 0) breakNow();
  }

  /* ---------- 傾きセンサー ---------- */
  function dead(v) { return Math.abs(v) < 0.08 ? 0 : v; }
  function onOrient(e) {
    if (e.gamma == null || e.beta == null) return;
    tilt.seen = true;
    if (tilt.g0 === null) { tilt.g0 = e.gamma; tilt.b0 = e.beta; }
    tilt.ax = dead(clamp((e.gamma - tilt.g0) / 22, -1, 1));
    tilt.ay = dead(clamp((e.beta - tilt.b0) / 22, -1, 1));
    setTiltUI();
  }
  function setTiltUI() {
    var b = $('tiltBtn');
    var txt = '傾き OFF', cls = 'btn-tilt off';
    if (tilt.supported === false) { txt = '傾き なし'; cls = 'btn-tilt off'; }
    else if (tilt.enabled && tilt.seen) { txt = '傾き ON'; cls = 'btn-tilt on'; }
    else if (tilt.enabled) { txt = '傾き 確認中'; cls = 'btn-tilt'; }
    if (b.textContent !== txt) b.textContent = txt;
    b.className = cls;
  }
  function tiltFailed() {
    tilt.enabled = false; tilt.supported = false; setTiltUI();
    showToast('この画面では傾きが使えません。指で遊べます');
  }
  function enableTilt() {
    if (typeof window.DeviceOrientationEvent === 'undefined') { tiltFailed(); return Promise.resolve(false); }
    var ask = Promise.resolve('granted');
